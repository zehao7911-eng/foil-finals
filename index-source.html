<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d31"><title>Foil Finals</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><small>INTERNATIONAL FENCING SERIES</small><h1>Foil <em>Finals</em></h1></div><button id="sound" aria-pressed="true">♪ Sound</button></header>
<section class="arena" aria-label="3D fencing arena"><canvas></canvas>
<div class="top"><div><small id="event"></small><strong id="rival"></strong></div><div id="score"><b id="you">0</b><span>–</span><b id="them">0</b><small>YOU / RIVAL</small></div></div>
<div id="cue" role="status"><small id="phase"></small><strong id="call"></strong><i id="clock"></i></div>
</section>
<section id="controls"><button id="start">En garde →</button><div id="actions" hidden><button data-move="0"><b>↗</b>Lunge<small>突刺</small></button><button data-move="1"><b>◇</b>Parry<small>格挡</small></button><button data-move="2"><b>↶</b>Retreat<small>后撤</small></button></div>
<div id="result" hidden><h2 id="verdict"></h2><button id="next">Next opponent →</button><button id="replay">Rematch</button></div></section>
<nav id="levels" aria-label="Competition rounds"></nav>
<p id="hint">Read the opponent’s stance. First to five touches wins.</p><p id="rewards" hidden></p>
</main><script src="vendor/three.min.js"></script><script type="module" src="app.mjs"></script></body></html>
